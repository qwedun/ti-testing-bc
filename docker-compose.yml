services:
  backend:
    build: .
    container_name: test_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    container_name: test_db
    environment:
      POSTGRES_DB: test_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data: